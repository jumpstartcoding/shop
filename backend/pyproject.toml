[project]
name = "shop-backend"
version = "0.1.0"
description = "API for a solo mechanic shop: customers, vehicles, work orders, estimates, invoices, payments."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "mangum>=0.19",
    "structlog>=24.4",
    "weasyprint>=70.0",
    "boto3>=1.43.114",
    "jinja2>=3.1.6",
    "stripe>=16.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"migrations/*" = ["E501"]
